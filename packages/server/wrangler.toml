name = "moain"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/m/*"]

[[d1_databases]]
binding = "DB"
database_name = "moain"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
DEMO = "1"
DEFAULT_TENANT = "alnoor"

# No cron on the hosted platform: window cutoffs are locked lazily on incoming requests (src/index.ts).
