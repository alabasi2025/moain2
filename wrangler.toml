# Root deploy config (hosted Workers for Platform pipeline deploys from the repo root).
# Local development uses packages/server/wrangler.toml — keep both in sync.
# deploy/worker.js is the pre-bundled server (rebuild: pnpm bundle) so the deploy needs no package install.
name = "moain"
main = "deploy/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "packages/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/m/*"]

[[d1_databases]]
binding = "DB"
database_name = "moain"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
DEMO = "1"
DEFAULT_TENANT = "alnoor"
